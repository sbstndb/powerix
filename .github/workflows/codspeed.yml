name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure the build
        run: cmake -S . -B build -DCODSPEED_MODE=simulation -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build the benchmark executables
        run: cmake --build build --target codspeed_benchmarks -j $(nproc)

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: |
            ./build/codspeed_benchmark_pow
            ./build/codspeed_benchmark_pow_fractional
            ./build/codspeed_benchmark_simd
            ./build/codspeed_benchmark_simd_extra
            ./build/codspeed_benchmark_asm
            ./build/codspeed_benchmark_asm_double
